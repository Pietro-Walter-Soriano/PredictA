name: forecast

# Hourly matchday cycle on GitHub: refresh data, forecast, archive pre-kick-off forecasts, score finished rounds,
# then commit data/ledger, data/rounds.json, data/backtest.json, data/calibration.json and REPORT.md.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      replay:
        description: "Rebuild the finished rounds of this season with the current engine before the normal cycle"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # downloaded archive (~80 MB): restored from the latest run, saved again under a new key at the end
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Setup
        run: ./setup.sh

      - name: Run matchday cycle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: ./run.sh

      - name: Replay finished rounds with the current engine
        if: ${{ inputs.replay }}
        run: |
          .venv/bin/python -I src/replay.py data
          .venv/bin/python -I src/evaluate.py data/ledger data data/rounds.json
          .venv/bin/python -I src/report.py data/rounds.json site/data/index.json REPORT.md
          .venv/bin/python -I src/render.py src/template.html site/data site/serie-a.html data/rounds.json

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serie-a-dashboard
          path: site/serie-a.html
          retention-days: 14

      # GitHub Pages: the dashboard as a fixed web page (needs Settings -> Pages -> Source: GitHub Actions, once)
      - name: Prepare Pages site
        run: mkdir -p _pages && cp site/serie-a.html _pages/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Publish to GitHub Pages
        id: pages
        continue-on-error: true   # Pages not enabled yet: the forecast itself still succeeds
        uses: actions/deploy-pages@v4

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger data/rounds.json data/backtest.json data/calibration.json REPORT.md
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "forecast update $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash
          git push
